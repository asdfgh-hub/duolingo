name: Build Cabin Crew English IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Verify project files
        run: |
          test -d "CabinCrewEnglish.xcodeproj"
          test -f "CabinCrewEnglish/CabinCrewEnglishApp.swift"
          test -f "CabinCrewEnglish/ContentView.swift"

      - name: Build archive
        run: |
          xcodebuild archive \
            -project "CabinCrewEnglish.xcodeproj" \
            -scheme "CabinCrewEnglish" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/CabinCrewEnglish.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/CabinCrewEnglish.xcarchive/Products/Applications/CabinCrewEnglish.app"
          test -d "$APP_PATH"
          rm -rf Payload CabinCrewEnglish.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry CabinCrewEnglish.ipa Payload
          test -s CabinCrewEnglish.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CabinCrewEnglish-unsigned-IPA
          path: CabinCrewEnglish.ipa
          if-no-files-found: error
          retention-days: 7
